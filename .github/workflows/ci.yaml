name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./J12_Evening

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: J12_Evening/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy app

      - name: Run DB-free tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/test_db
          SECRET_KEY: dummy-ci-secret-not-real
        run: pytest tests/test_utils.py --cov=app --cov-report=term-missing

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./J12_Evening

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://demo:secret123@localhost:5432/test_db
      SECRET_KEY: ci-not-a-real-secret

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: J12_Evening/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        run: pytest --cov=app
